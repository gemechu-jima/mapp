name: Build Android APK via EAS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: EAS Android Preview Builds
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Link or Create Expo Project
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx --yes eas-cli@latest init --account onetwo1 --non-interactive --force

      - name: Trigger Modern Android APK Build (64-bit)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx --yes eas-cli@latest build --platform android --profile preview-modern --non-interactive --no-wait

      - name: Trigger Legacy Android APK Build (32-bit Old Phones)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx --yes eas-cli@latest build --platform android --profile preview-legacy --non-interactive --no-wait
