name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-android:
    name: Build APK on GitHub Runner
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies and EAS CLI
        run: |
          npm ci
          npm install -g eas-cli

      - name: Build Android APK locally on GitHub Runner
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          AUTH_ENDPOINT: ${{ secrets.AUTH_ENDPOINT }}
          PUBLIC_KEY: ${{ secrets.PUBLIC_KEY }}
          URL_ENDPOINT: ${{ secrets.URL_ENDPOINT }}
          EXPO_PUBLIC_CLOUDINARY_CLOUD_NAME: ${{ secrets.EXPO_PUBLIC_CLOUDINARY_CLOUD_NAME }}
          EXPO_PUBLIC_CLOUDINARY_API_KEY: ${{ secrets.EXPO_PUBLIC_CLOUDINARY_API_KEY }}
          EXPO_PUBLIC_CLOUDINARY_API_SECRET: ${{ secrets.EXPO_PUBLIC_CLOUDINARY_API_SECRET }}
        run: eas build --platform android --profile preview-modern --local --non-interactive --output=./app-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ./app-release.apk
          retention-days: 14

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Android APK Build #${{ github.run_number }}
          files: ./app-release.apk
